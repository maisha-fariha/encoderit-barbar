name: encoderit_barbar
description: EncoderIT Barbar app — structure aligned with flutter_gems (GetX, data layer, offline/Hive).
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  gems_core:
    path: flutter_gems/packages/gems_core
  gems_data_layer:
    path: flutter_gems/packages/gems_data_layer
  gems_responsive:
    path: flutter_gems/packages/gems_responsive

  get: ^4.6.6
  get_it: ^7.7.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  google_fonts: ^8.0.2
  flutter_svg: ^2.2.4
  intl: ^0.20.2

  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  bcrypt: ^1.2.0

  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  dio: ^5.4.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.7
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
